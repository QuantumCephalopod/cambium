4V:
  w: "Frame generates the realized address, cell and body geometry in which a located encounter becomes possible."
  x: "Bearing carries one shared viewer orientation and world-compass relation through time, inspection and encounter changes."
  z: "Focus governs perceptual and contact access through occupied bounds, the navigator aperture, glass geometry and the owned lens."
