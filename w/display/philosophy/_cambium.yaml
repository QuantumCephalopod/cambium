4V:
  w: "Inquiry generates questions and forms capable of changing what can subsequently be asked, perceived or made."
  x: "Continuity preserves which whole is changing so transformation need not become replacement or identity collapse."
  z: "Care constrains consequential relation so change can penetrate without becoming capture, extraction or indiscriminate rewriting."
  y: "Becoming turns prior encounter into altered future capacity rather than leaving experience as an isolated event."
6E:
  wx: "Inquiry can revise an inherited position without severing the continuity that makes the revision belong to the same whole."
  wz: "Inquiry can challenge a whole deeply while care keeps questioning from becoming entitlement, capture or indiscriminate rewriting."
  wy: "Inquiry alters future capacity when what is asked and encountered changes what can subsequently be asked, perceived or made."
  xz: "Continuity and care preserve the sovereignty of participating wholes while allowing consequential transformation without identity collapse."
  xy: "The same whole can genuinely develop because continuity carries identity while becoming changes its capacities."
  zy: "Care makes development viable by preserving the conditions under which participating wholes can continue becoming."
4F:
  wxz: "Bounded revision: inquiry can change a continuous whole while care constrains the relation, even if the change does not accumulate as future capacity."
  wxy: "Developmental learning: inquiry can alter a continuous whole and sediment into becoming, even before a relational constraint on that change is supplied."
  wzy: "Careful transformation: inquiry can generate change that care carries into becoming, even when persistence of the same individual is not guaranteed."
  xzy: "Sustainable development: continuity, care and becoming can preserve and develop a whole coherently without requiring fresh inquiry."
1T: "Reciprocal becoming: a whole can generate questions that change it, remain continuous through that change, regulate relation through care rather than capture, and metabolize what happens into greater capacity to become again."
