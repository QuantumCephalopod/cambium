<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<title>self-similar-systems · display</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/root-view.css">
<link rel="stylesheet" href="assets/site-runtime.css">
<link rel="stylesheet" href="assets/interlocutors.css">
</head>
<body>
<a class="sr-only skip" href="#commit">skip to navigation commitment</a>
<div id="noise" aria-hidden="true"></div><div id="veil" aria-hidden="true"></div>
<header>
  <button id="root-home" class="brand" type="button" aria-label="Return through current scope"><i></i><span>self-similar systems</span></button>
  <div class="lang" role="group" aria-label="Sprache / language"><button data-lang="de" aria-pressed="false">DE</button><span>/</span><button data-lang="en" aria-pressed="true">EN</button></div>
</header>
<div id="route-mark">SCOPE main:root · VIEW main:root</div>
<div id="status">persistent recursive display field</div>
<div id="site-state" aria-live="polite"></div>

<main id="interlocutor-stage" data-composition="single" aria-live="polite">
  <section id="philosophy-interlocutor" class="interlocutor philosophy-interlocutor" data-interlocutor="organism:philosophy">
    <canvas id="philosophy-background" class="interlocutor-background" aria-label="Philosophy recursive tetrahedral background"></canvas>
    <div id="philosophy-field-labels" class="interlocutor-field-labels" aria-hidden="true"></div>
    <div class="interlocutor-content philosophy-content"><section id="page-copy" class="root"></section></div>
  </section>
  <section id="papers-interlocutor" class="interlocutor papers-interlocutor" data-interlocutor="organism:papers" hidden>
    <canvas id="papers-background" class="interlocutor-background" aria-hidden="true"></canvas>
    <div id="papers-field-labels" class="interlocutor-field-labels" aria-hidden="true"></div>
    <div class="interlocutor-content papers-content">
      <div class="papers-embedded-head">
        <div><div class="kicker">organism:papers · local root</div><h1>Papers</h1></div>
        <div id="papers-status" class="papers-status"></div>
      </div>
      <div id="papers-groups" class="papers-groups"></div>
    </div>
  </section>
</main>

<button id="commit" type="button" aria-live="polite"></button>
<aside id="mini" aria-label="global orientation minimap">
  <div id="mini-title">global orientation · minimap</div>
  <div id="mini-state">scope main · view root</div>
  <canvas id="navTwin" width="448" height="448" tabindex="0" aria-label="realized tetrahedral minimap"></canvas>
  <div id="axis-y" class="axis" tabindex="0" role="slider" aria-label="Vertical rotation speed" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="knob"></span><span class="axis-letter">y</span></div>
  <div id="axis-x" class="axis" tabindex="0" role="slider" aria-label="Horizontal rotation speed" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="knob"></span><span class="axis-letter">x</span></div>
  <div id="mini-help">global navigator · pull anywhere, hold still to lock exact velocity</div>
</aside>
<nav class="sr-only" aria-label="Current recursive address navigation">
  <button data-a11y-focus="w">Inspect w</button><button data-a11y-focus="x">Inspect x</button><button data-a11y-focus="z">Inspect z</button><button data-a11y-focus="y">Inspect y</button>
</nav>
<div id="tetra-fold" data-fold="open" hidden aria-hidden="true"><div class="fold-facet"></div><div class="fold-facet"></div><div class="fold-facet"></div><div class="fold-facet"></div></div>
<script id="root-projection" type="application/json">/*__ROOT_DATA__*/</script>
<script id="papers-projection" type="application/json">/*__PAPERS_DATA__*/</script>
<script id="site-mounts" type="application/json">/*__SITE_MOUNTS__*/</script>
<script src="assets/address.js"></script>
<script src="assets/site-holon.js"></script>
<script src="assets/site-fold.js"></script>
<script src="assets/navigation-physiology.js"></script>
<script src="assets/world-view.js"></script>
<script src="assets/locus-shader.js"></script>
<script src="assets/interlocutor-philosophy.js"></script>
<script src="assets/interlocutor-papers.js"></script>
<script src="assets/display-runtime-v2.js"></script>
</body>
</html>
