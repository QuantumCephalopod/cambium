<!doctype html><meta charset="utf-8"><title>Legal live viewport witness</title>
<style>body{margin:8px;background:#ddd;font:14px system-ui}nav{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}button{font:inherit}iframe{display:block;border:0;width:390px;height:844px;background:#111}p{margin:8px 0}</style>
<nav><button id="privacy">Datenschutz</button><button id="legal">Impressum</button><button id="overview">Überblick</button><button id="de">Deutsch</button><button id="en">English</button><button id="narrow">390 × 844</button><button id="wide">1280 × 800</button></nav>
<p id="status">Real production site; iframe sets CSS viewport only. No source, renderer, history or response rewriting.</p>
<iframe title="Actual sss.saarland" src="https://sss.saarland/?lang=de#main:z"></iframe>
<script>const f=document.querySelector('iframe');let lang='de',address='z';function visit(){f.src='https://sss.saarland/?lang='+lang+'#main:'+address}for(const [id,value]of [['privacy','z'],['legal','xz'],['overview','overview']])document.getElementById(id).onclick=()=>{address=value;visit()};for(const id of ['de','en'])document.getElementById(id).onclick=()=>{lang=id;visit()};document.getElementById('narrow').onclick=()=>{f.style.width='390px';f.style.height='844px'};document.getElementById('wide').onclick=()=>{f.style.width='1280px';f.style.height='800px'};</script>
