4V:
  w: "Embodiment gives each interlocutor a material local world: shader, background, manifestation and perceptual body."
  x: "Continuity preserves stable interlocutor identity, local root, state and activity relation across remounting, rebuilds and encounter changes."
  z: "Orientation governs global address perception, navigation, camera framing, membrane transition and shared rotational state."
  y: "Population admits actual page-organisms into the global site-space so physically present holons become addressable encounters."
6E:
  wx: "Embodiment remains attributable to the same interlocutor across change because continuity binds material manifestation to stable identity rather than host address."
  wz: "Embodied local worlds can rotate, frame and transition coherently because orientation acts on presentation without replacing local manifestation."
  wy: "Population becomes perceptible because admitted page-organisms arrive as embodied holons rather than abstract address records."
  xz: "Navigation and remounting can change where and how an interlocutor is encountered while continuity preserves which whole is moving through that oriented field."
  xy: "The site population can differentiate and be redistributed through recursive addresses without identity collapse because continuity survives relocation."
  zy: "Population becomes globally navigable because orientation resolves physically present holons into address/locus targets and encounter transitions."
4F:
  wxz: "Persistent embodiment: the same interlocutor can remain materially itself while orientation and navigation alter its framing or host placement."
  wxy: "Relocatable bodies: autonomous embodied holons can be added, moved or differentiated through the population while retaining identity and local tissue."
  wzy: "Navigable manifestation: physically admitted holons become visible encounter worlds whose embodiment is reached through the global orientation membrane."
  xzy: "Stable address ecology: site population may grow, split and remount while continuity and orientation preserve lawful global addressing and encounter identity."
1T: "Display is a persistent oriented membrane in which a population of autonomous embodied interlocutors is physically addressed, globally navigable, and continuous through relocation; the repository anatomy itself determines which encounters exist while each holon remains locally itself."
