4V:
  w: Transparency
  x: Provenance
  z: Rights
  y: Remedy
6E:
  wx: Processing becomes understandable only when disclosure stays tied to its actual source and purpose.
  wz: Transparency is actionable only when the affected person's rights are visible with it.
  wy: Disclosure remains useful when it leads to a concrete route for questions, objections and correction.
  xz: Provenance lets rights attach to the actual processing rather than an abstract privacy promise.
  xy: Source-grounded processing can be corrected or narrowed without losing what actually happened.
  zy: Rights become effective when there is a reachable mechanism for exercising them.
4F:
  wxz: Transparency, provenance and rights describe lawful processing without yet guaranteeing an operative route for response.
  wxy: Transparency, provenance and remedy make processing answerable without yet enumerating the affected person's rights.
  wzy: Transparency, rights and remedy make the notice actionable without independently grounding claims in actual processing provenance.
  xzy: Provenance, rights and remedy can resolve concrete cases without independently making the processing understandable in advance.
1T: A privacy notice is a public processing interface that requires transparency, provenance, rights and remedy together.
