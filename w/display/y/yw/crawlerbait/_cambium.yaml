4V:
  w: "Baits creates durable same-type crawlerbait bodies from observed 404 addresses. Crossing crawlerbait:w opens an independent bait-space whose recursive placement is geometry, while each bait keeps the observed path as identity."
  x: "Traces preserves already-owned provider evidence across time: one fixed migration checkpoint plus immutable captured windows, from which current longitudinal path and claimed-client state can be regenerated locally."
  z: "Membrane keeps sensing boundaries, credentials, static secretion and outward representation coherent without deciding which observation is relevant or valuable."
  y: "Tide grows future capacity by capturing only provider time not yet locally owned, then metabolizing owned Traces into current Baits and Membrane without refetching historical evidence."
6E:
  wx: "Baits × Traces grounds every bait in evidence Crawlerbait already owns, so public bodies remain attributable while later address or rendering laws can be replayed locally."
  wz: "Baits × Membrane lets a bait become crawlable public form while remaining wholly inside Crawlerbait ownership; bait-space address is placement, not global website authority."
  wy: "Baits × Tide lets newly captured observations create or deepen bait bodies as the same-type population grows, while prior baits can be regenerated from local memory alone."
  xz: "Traces × Membrane preserves evidence faithfully while keeping client identity explicitly claimed, credentials outside repository bytes and representation separate from observation."
  xy: "Traces × Tide separates acquisition from metabolism: new provider windows append once to durable memory, while repeated downstream reprocessing consumes that local memory instead of re-querying the sensor."
  zy: "Membrane × Tide makes observation periodic and passive: Cloudflare is queried only for not-yet-owned time, and ordinary crawler reads never execute Crawlerbait logic."
4F:
  wxz: "Witnessed bait: locally owned evidence can support addressed crawlable bait behind a bounded membrane even if no further provider acquisition ever occurs."
  wxy: "Living reef: addressed baits, durable traces and repeated tides can develop one population through time, but without Membrane that growth would have no lawful public or credential boundary."
  wzy: "Static regrowth: new capture can grow crawlable bait bodies inside the membrane, but without Traces there is no durable local evidence from which old or new bodies can be regenerated."
  xzy: "Passive observatory: durable traces can continue through bounded periodic acquisition without Baits, but then Crawlerbait remembers the ocean without changing what future crawlers can encounter."
1T: "Crawlerbait is a self-similar crawler reef in which Cloudflare supplies only not-yet-owned observations, Traces keeps those observations durably local, and replayable local metabolism grows the addressed bait population and bounded public membrane without ever making historical provider refetch a downstream dependency."
