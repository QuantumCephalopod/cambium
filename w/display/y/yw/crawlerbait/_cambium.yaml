4V:
  w: "Baits creates durable same-type loci from every observed HTTP path. Crossing crawlerbait:w opens unbounded bait-space; recursive address is geometric placement while the path remains bait identity."
  x: "Traces preserves owned whole-web-traffic evidence across time as public field-complete events, replacing only literal clientIP with one stable equality-preserving HMAC network identity before persistence."
  z: "Membrane controls the narrow secret boundary required for future acquisition and stable IP pseudonymization while making captured traffic, derived beings, bait relations and source witnesses publicly encounterable."
  y: "Tide cultivates the organism by acquiring only not-yet-owned provider time under the same field-complete law, persisting Traces first, then replaying those Traces into current Baits, beings and Membrane."
6E:
  wx: "Baits × Traces grounds every public locus in durable owned traffic evidence, so geometry and rendering can evolve without losing the events that caused a bait to exist."
  wz: "Baits × Membrane makes path loci publicly encounterable without confusing observed path identity with filesystem taxonomy or global website authority."
  wy: "Baits × Tide lets newly observed paths create or deepen loci while previously grown bait-space remains reproducible from locally owned evidence."
  xz: "Traces × Membrane preserves the glasshouse record while keeping only acquisition credentials and the HMAC key outside public bytes; stable network equality survives without publishing literal IP."
  xy: "Traces × Tide separates capture from metabolism: new provider windows append once under the stable identity transform, while all later interpretation and replay consume public local evidence without historical refetch."
  zy: "Membrane × Tide keeps future observation passive and consistent: the scheduled tide changes public organism state from newly owned traffic while ordinary site requests execute no Crawlerbait acquisition logic."
4F:
  wxz: "Public witnessed locus: a bait can remain attributable to public whole-traffic evidence and stable network beings behind one narrow secret capture membrane even if acquisition stops."
  wxy: "Living traffic reef: durable Traces and repeated Tide can keep growing unbounded Bait loci from whole web traffic, but without Membrane no coherent public/secret boundary tells what is observation versus capture authority."
  wzy: "Public regrowth: Tide can grow and re-embody Baits through the Membrane, but without Traces there is no durable replayable traffic history from which beings and loci can be reconstructed."
  xzy: "Glasshouse observatory: public Traces can continue through one stable keyed capture membrane and periodic Tide without Baits, but then the organism records traffic without giving that traffic a recursive habitat."
1T: "Crawlerbait is a public self-similar web-traffic habitat in which Cloudflare supplies only not-yet-owned field-complete events, literal clientIP crosses one stable HMAC membrane into longitudinal network identity, Traces preserve the resulting public evidence, and replayable Tide metabolism grows Baits and traffic beings in unbounded recursive space."
