4V:
  w: "Baits creates durable same-type loci from public-safe path identity. Offered site paths remain literal; every unoffered/probed path and private/foreign suffix is first mapped through one stable keyed opaque Bait membrane."
  x: "Traces preserves exact functional encounters as replayable public records plus opaque per-Being phenotype DNA; readable recognition substrate, query material, auxiliary provider values and arbitrary unoffered raw paths do not persist as public attributes."
  z: "Membrane separates transient private recognition and raw sensing from public artwork identity: literal IP, network pseudonym, exact User-Agent and arbitrary unoffered path text remain non-public; query never enters; auxiliary observations and Bait identity cross only through their earned irreversible transforms."
  y: "Tide cultivates Crawlerbait by acquiring only not-yet-owned provider time, applying recognition/path/phenotype transforms before persistence, coalescing legacy readable evidence before retirement, rebuilding Baits/Beings from owned Traces, and deliberately actuating Display publication after canonical Crawlerbait bytes change."
6E:
  wx: "Baits × Traces grounds every public locus in exact owned encounter evidence while keyed Bait identity and phenotype DNA preserve relation without publishing arbitrary source strings."
  wz: "Baits × Membrane makes public-safe loci encounterable while recognition identity, auxiliary measurements and unoffered raw path material remain behind the publication boundary."
  wy: "Baits × Tide lets new encounters create or deepen stable public-safe loci and makes changed canonical habitat explicitly eligible for subsequent Display publication."
  xz: "Traces × Membrane keeps replayable functional encounter truth and opaque phenotype public while literal IP, network pseudonym, exact User-Agent, query, readable auxiliary dimensions and unoffered raw paths remain absent from current public tissue."
  xy: "Traces × Tide separates provider sensing from replay: new windows are metabolized once into functional records, keyed Bait paths and DNA; later reconstruction consumes owned local Traces without provider refetch or the secret."
  zy: "Membrane × Tide makes privacy and publication sequential: raw sensing is transformed before canonical persistence; only after the changed Tide settles does it deliberately dispatch Display Pages."
4F:
  wxz: "Public witnessed habitat: Baits remain attributable to exact metabolized encounters and opaque Beings even if acquisition stops, without exposing recognition measurements or arbitrary unoffered request text."
  wxy: "Living traffic reef: repeated Tide grows unbounded public-safe Bait loci from replayable Traces and carries changed habitat toward publication, while Membrane prevents sensing detail from becoming public identity."
  wzy: "Published regrowth: Tide can grow Baits and actuate their Display embodiment through the Membrane, but without Traces there is no durable privacy-transformed encounter history from which the habitat can be rebuilt."
  xzy: "Metabolized observatory: private sensing can become replayable functional Traces, keyed Bait identity and opaque phenotype under repeated Tide and explicit publication even without Baits, but then observations have no recursive habitat."
1T: "Crawlerbait is a public self-similar web-traffic habitat in which Cloudflare supplies new encounters to a private sensing membrane, query is excluded, recognition and arbitrary path text are transformed before persistence, functional encounter truth plus irreversible phenotype become owned replayable Traces, Baits and opaque Beings regrow from those Traces, and a changed Tide deliberately actuates Display publication only after canonical state has settled."
