4V:
  w: "Sediment turns previously ephemeral crawler contact into durable public form that can be encountered later."
  x: "Continuity carries one Crawlerbait identity, its admitted observations and its grown route history across bounded tides and lawful remounting."
  z: "Boundary constrains which external request pressure may enter the body through sanitization, privacy, recurrence and growth budgets."
  y: "Adaptation lets accumulated admitted pressure alter the static reef that future crawlers encounter."
6E:
  wx: "Sediment accumulates as development of one continuing reef rather than unrelated files minted by each tide."
  wz: "Only pressure that survives the boundary may become public sediment, so contact does not become filesystem authority by default."
  wy: "New sediment changes the future encounter surface and can therefore generate new observable crawler pressure."
  xz: "Continuity survives noisy or hostile traffic because boundary preserves the same whole without admitting every request."
  xy: "The same experiment can genuinely develop because continuity carries prior state while adaptation changes later encounter conditions."
  zy: "Adaptation remains bounded learning from contact rather than surrender to contact because every growth act remains governed by the admission boundary."
4F:
  wxz: "Safe fossilization can preserve recurring crawler traces as one durable reef even when those traces do not yet alter later foraging conditions."
  wxy: "A continuing public reef can grow from prior contact, but without boundary arbitrary traffic could sculpt it without limit."
  wzy: "Bounded responsive growth can turn crawler contact into later public form, but without continuity those forms would not belong to one developing holon."
  xzy: "One bounded continuing experiment can adapt future conditions, but without sediment no new public form exists for a crawler to encounter later."
1T: "Crawlerbait is a continuing static machine habitat in which passively observed crawler pressure is admitted through a bounded gate and sedimented into later public form, so the web can alter the shape of what it encounters next without any crawler request executing site logic."
