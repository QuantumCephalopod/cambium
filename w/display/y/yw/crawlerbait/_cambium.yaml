4V:
  w: "Baits creates durable same-type crawlerbait bodies from observed 404 addresses. Crossing crawlerbait:w opens an independent bait-space whose recursive placement is geometry, while each bait keeps the observed path as identity."
  x: "Traces preserves the longitudinal evidence that lets later observations remain attributable to the same observed path and claimed client signatures across tides."
  z: "Membrane keeps sensing, credentials, static secretion and outward representation coherent without deciding which observation is relevant or valuable."
  y: "Tide lets passive observations alter future capacity by periodically reacquiring Cloudflare pressure and regrowing the bait population, traces and public projection."
6E:
  wx: "Baits × Traces makes each encountered bait attributable to the observations and claimed client signatures that caused or revisited it instead of becoming an ungrounded decorative page."
  wz: "Baits × Membrane lets a bait become crawlable public form while remaining wholly inside Crawlerbait ownership; bait-space address is placement, not global website authority."
  wy: "Baits × Tide lets new observations create or relocate bait bodies as the same-type population grows, so future crawlers encounter a changed reef."
  xz: "Traces × Membrane preserves evidence faithfully while keeping client identity explicitly claimed, secrets outside repository bytes and representation separate from observation."
  xy: "Traces × Tide accumulates repeated encounters into continuing path/signature histories instead of minting unrelated observations on every pulse."
  zy: "Membrane × Tide makes observation periodic and passive: Cloudflare is read after requests occurred, so ordinary crawler reads never execute Crawlerbait logic."
4F:
  wxz: "Witnessed bait: a static bait can exist with attributable traces and a bounded public membrane even if no later tide ever changes it again."
  wxy: "Living reef: addressed baits, continuing traces and repeated tides can develop one population through time, but without Membrane that growth would have no lawful public or credential boundary."
  wzy: "Static regrowth: the tide can grow new crawlable bait bodies inside the membrane, but without Traces there is no evidence grounding why any bait exists or how it was encountered."
  xzy: "Passive observatory: traces can accumulate across periodic bounded sensing without Baits, but then Crawlerbait records the ocean without changing what future crawlers can encounter."
1T: "Crawlerbait is a self-similar crawler reef in which passive web traces periodically grow a same-type addressed bait population behind one bounded membrane, so the observable ecology changes future encounter surfaces while every ordinary crawler request remains static."
