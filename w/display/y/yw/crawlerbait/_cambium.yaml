4V:
  w: "Baits creates durable same-type loci from every observed HTTP path. Crossing crawlerbait:w opens unbounded bait-space; recursive address is geometric placement while the path remains Bait identity."
  x: "Traces preserves exact functional encounters as replayable public records plus opaque per-Being phenotype DNA; readable recognition substrate, query material and auxiliary provider values do not persist as public attributes."
  z: "Membrane separates transient private recognition and rich sensing from public artwork identity: literal IP, network pseudonym and exact User-Agent remain non-public, query never enters, and auxiliary observations cross only as keyed irreversible phenotype interference."
  y: "Tide cultivates Crawlerbait by acquiring only not-yet-owned provider time, condensing legacy or fresh observations before readable retirement, rebuilding Baits/Beings from owned Traces, and deliberately actuating Display publication after canonical Crawlerbait bytes change."
6E:
  wx: "Baits × Traces grounds every public locus in exact owned encounter evidence while phenotype DNA can shape Beings without turning readable provider measurements into Bait taxonomy."
  wz: "Baits × Membrane makes observed paths publicly encounterable while recognition identity and auxiliary measurements remain behind the publication boundary."
  wy: "Baits × Tide lets new encounters create or deepen loci and makes changed canonical habitat explicitly eligible for subsequent Display publication."
  xz: "Traces × Membrane keeps replayable functional encounter truth and opaque phenotype public while literal IP, network pseudonym, exact User-Agent, query and readable auxiliary dimensions remain absent from current public tissue."
  xy: "Traces × Tide separates provider sensing from replay: new windows are metabolized once into functional records and DNA, then all later Bait/Being reconstruction consumes owned local Traces without provider refetch."
  zy: "Membrane × Tide makes publication an explicit bounded consequence: sensing and metabolism finish first; when canonical Crawlerbait bytes changed, Tide deliberately dispatches Display Pages rather than relying on workflow-authored pushes to recurse."
4F:
  wxz: "Public witnessed habitat: Baits remain attributable to exact metabolized encounters and opaque Beings even if acquisition stops, without exposing the measurements used for recognition or phenotype."
  wxy: "Living traffic reef: repeated Tide grows unbounded Bait loci from replayable Traces and carries changed habitat toward publication, while Membrane is still required to separate public artwork from private sensing."
  wzy: "Published regrowth: Tide can grow Baits and actuate their Display embodiment through the Membrane, but without Traces there is no durable encounter history from which the habitat can be rebuilt."
  xzy: "Metabolized observatory: private sensing can become replayable functional Traces and opaque phenotype under repeated Tide and explicit publication even without Baits, but then observations have no recursive habitat."
1T: "Crawlerbait is a public self-similar web-traffic habitat in which Cloudflare supplies new encounters to a private sensing membrane, functional encounter truth and irreversible phenotype DNA become owned replayable Traces, Baits and opaque Beings regrow from those Traces, and a changed Tide deliberately actuates Display publication only after canonical state has settled."
