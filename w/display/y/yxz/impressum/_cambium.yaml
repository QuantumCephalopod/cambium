4V:
  w: Identity
  x: Address
  z: Contact
  y: Accountability
6E:
  wx: Public operator identity remains attributable through a stable service address.
  wz: Operator identity becomes directly reachable rather than merely named.
  wy: Named operation can remain accountable as the site continues to change.
  xz: A physical service address and electronic contact jointly make the operator reachable.
  xy: Stable addressability lets accountability remain attached to the same operator through site evolution.
  zy: Direct communication lets accountability answer concrete external concerns.
4F:
  wxz: Identity, address and contact form a reachable provider surface without yet stating how responsibility persists over time.
  wxy: Identity, address and accountability preserve attributable operation without yet supplying a direct electronic contact.
  wzy: Identity, contact and accountability permit responsive responsibility without yet grounding a physical service address.
  xzy: Address, contact and accountability preserve reachability over time without independently naming who the operator is.
1T: An Impressum is the public operator interface that requires identity, physical address, direct contact and continuing accountability together.
