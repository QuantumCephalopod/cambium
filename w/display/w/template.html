<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#05070a">
<title>self-similar-systems · display</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/root-view.css">
<link rel="stylesheet" href="assets/site-runtime.css">
<link rel="stylesheet" href="assets/interlocutors.css">
<link rel="stylesheet" href="assets/navigation-aperture.css">
/*__SITE_STYLES__*/
<link rel="stylesheet" href="assets/display-safe-area.css">
</head>
<body>
<a class="sr-only skip" href="#mini-trigger">skip to global navigation</a>
<div id="noise" aria-hidden="true"></div><div id="veil" aria-hidden="true"></div>
<header data-display-occupancy="top">
  <button id="root-home" class="brand" type="button" aria-label="Return to global overview"><i></i><span>self-similar systems</span></button>
  <div class="lang" role="group" aria-label="Display / Sprache / language"><label class="inverse-control" title="Invert global colors"><input id="inverse-mode" type="checkbox" aria-label="Invert global colors"><span aria-hidden="true">◐</span></label><span>·</span><button data-lang="de" aria-pressed="false">DE</button><span>/</span><button data-lang="en" aria-pressed="true">EN</button></div>
</header>
<div id="display-membrane-status" data-display-occupancy="top">
  <div id="route-mark">GLOBAL main:overview</div>
  <div id="status">persistent recursive display field</div>
  <div id="site-state" aria-live="polite"></div>
</div>

<main id="interlocutor-stage" data-composition="single" aria-live="polite">
/*__INTERLOCUTOR_SURFACES__*/
</main>

<aside id="mini" data-aperture="closed" data-pinned="false" aria-label="Global navigation aperture">
  <button id="mini-trigger" data-display-occupancy="right bottom" type="button" aria-expanded="false" aria-controls="mini-pocket" aria-label="Open global tetrahedral navigator">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <path class="shape-square" d="M4 4h16v16H4Z"/>
      <path class="shape-diamond" d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/>
      <path d="M12 6.5 17.2 15.7 6.8 15.7Z"/>
      <path d="M12 6.5 12 12.3M6.8 15.7 12 12.3 17.2 15.7" opacity=".72"/>
    </svg>
  </button>
  <div id="mini-pocket" data-display-occupancy="right bottom" aria-hidden="true">
    <div id="mini-core">
      <div id="mini-title">global orientation · minimap</div>
      <div id="mini-state">global overview</div>
      <canvas id="navTwin" width="448" height="448" tabindex="0" aria-label="global mounted site-holon navigator"></canvas>
      <div id="axis-y" class="axis" tabindex="0" role="slider" aria-label="Vertical rotation speed" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="knob"></span><span class="axis-letter">y</span></div>
      <div id="axis-x" class="axis" tabindex="0" role="slider" aria-label="Horizontal rotation speed" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="knob"></span><span class="axis-letter">x</span></div>
      <div id="mini-help">pull anywhere · hold still → lock exact velocity</div>
    </div>
  </div>
</aside>
<div id="tetra-fold" data-fold="open" hidden aria-hidden="true"><div class="fold-facet"></div><div class="fold-facet"></div><div class="fold-facet"></div><div class="fold-facet"></div></div>
<script id="site-registry" type="application/json">/*__SITE_REGISTRY__*/</script>
<script id="site-projections" type="application/json">/*__SITE_PROJECTIONS__*/</script>
<script src="assets/address.js"></script>
<script src="assets/site-holon.js"></script>
<script src="assets/site-fold.js"></script>
<script src="assets/navigation-physiology.js"></script>
<script src="assets/world-view.js"></script>
<script src="assets/locus-shader.js"></script>
<script src="assets/display-safe-area.js"></script>
/*__SITE_SCRIPTS__*/
<script src="assets/navigation-aperture.js"></script>
<script src="assets/display-runtime-v2.js"></script>
</body>
</html>
