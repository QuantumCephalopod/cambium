name: temporary Display root evacuation

on:
  push:
    branches: [staging/display-metamorphosis]
    paths:
      - '.github/workflows/root-evacuation-staging.yml'

permissions:
  contents: write

jobs:
  evacuate:
    if: github.repository == 'QuantumCephalopod/cambium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finish Display 1→4 redistribution
        run: |
          set -euo pipefail

          mkdir -p w/display/w w/display/x w/display/z w/display/_waste/root-residue-20260916 _waste

          # one-off membrane marker is not an organism primitive
          git mv w/interface.md _waste/retired-w-interface-20260916.md

          # child ROLE markers were scaffolding, not canonical tissue
          git mv w/display/w/ROLE.md w/display/_waste/root-residue-20260916/ROLE-w.md
          git mv w/display/x/ROLE.md w/display/_waste/root-residue-20260916/ROLE-x.md
          git mv w/display/z/ROLE.md w/display/_waste/root-residue-20260916/ROLE-z.md
          git mv w/display/y/ROLE.md w/display/_waste/root-residue-20260916/ROLE-y.md

          # w · Embodiment
          git mv w/display/template.html w/display/w/template.html
          git mv w/display/root-view.css w/display/w/root-view.css
          git mv w/display/interlocutors.css w/display/w/interlocutors.css
          git mv w/display/locus-shader.js w/display/w/locus-shader.js
          git mv w/display/favicon.svg w/display/w/favicon.svg

          # x · Continuity
          git mv w/display/display-runtime-v2.js w/display/x/display-runtime-v2.js
          git mv w/display/site-holon.js w/display/x/site-holon.js
          git mv w/display/site-holon.test.cjs w/display/x/site-holon.test.cjs
          git mv w/display/live w/display/x/live

          # z · Orientation
          git mv w/display/world-view.js w/display/z/world-view.js
          git mv w/display/navigation-physiology.js w/display/z/navigation-physiology.js
          git mv w/display/navigation-physiology.test.cjs w/display/z/navigation-physiology.test.cjs
          git mv w/display/navigation-aperture.js w/display/z/navigation-aperture.js
          git mv w/display/navigation-aperture.css w/display/z/navigation-aperture.css
          git mv w/display/site-fold.js w/display/z/site-fold.js
          git mv w/display/site-fold.test.cjs w/display/z/site-fold.test.cjs
          git mv w/display/site-runtime.css w/display/z/site-runtime.css

          # non-authoritative pre-split residue
          for f in \
            content.json \
            papers-site-mounts.json papers-site-runtime.js papers-site.css papers-site.test.cjs papers-template.html papers-view.js papers.css \
            philosophy-view.js philosophy.css philosophy.interface.md root-view.js \
            site-holon-specimen.css site-holon-specimen.html site-holon-specimen.js \
            site-runtime.js style.css view.js
          do
            git mv "w/display/$f" "w/display/_waste/root-residue-20260916/$f"
          done

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          replace('y/build.py', [
              ("'root-view.css': DISPLAY/'root-view.css'", "'root-view.css': DISPLAY/'w'/'root-view.css'"),
              ("'site-runtime.css': DISPLAY/'site-runtime.css'", "'site-runtime.css': DISPLAY/'z'/'site-runtime.css'"),
              ("'interlocutors.css': DISPLAY/'interlocutors.css'", "'interlocutors.css': DISPLAY/'w'/'interlocutors.css'"),
              ("'navigation-aperture.css': DISPLAY/'navigation-aperture.css'", "'navigation-aperture.css': DISPLAY/'z'/'navigation-aperture.css'"),
              ("'world-view.js': DISPLAY/'world-view.js'", "'world-view.js': DISPLAY/'z'/'world-view.js'"),
              ("'navigation-physiology.js': DISPLAY/'navigation-physiology.js'", "'navigation-physiology.js': DISPLAY/'z'/'navigation-physiology.js'"),
              ("'site-holon.js': DISPLAY/'site-holon.js'", "'site-holon.js': DISPLAY/'x'/'site-holon.js'"),
              ("'site-fold.js': DISPLAY/'site-fold.js'", "'site-fold.js': DISPLAY/'z'/'site-fold.js'"),
              ("'locus-shader.js': DISPLAY/'locus-shader.js'", "'locus-shader.js': DISPLAY/'w'/'locus-shader.js'"),
              ("'navigation-aperture.js': DISPLAY/'navigation-aperture.js'", "'navigation-aperture.js': DISPLAY/'z'/'navigation-aperture.js'"),
              ("'display-runtime-v2.js': DISPLAY/'display-runtime-v2.js'", "'display-runtime-v2.js': DISPLAY/'x'/'display-runtime-v2.js'"),
              ("'favicon.svg': DISPLAY/'favicon.svg'", "'favicon.svg': DISPLAY/'w'/'favicon.svg'"),
              ("text = (DISPLAY/'template.html').read_text(encoding='utf-8')", "text = (DISPLAY/'w'/'template.html').read_text(encoding='utf-8')"),
          ])

          replace('w/display/x/site-holon.js', [
              ("require('../../z/address.js')", "require('../../../z/address.js')"),
          ])
          replace('w/display/x/site-holon.test.cjs', [
              ("require('./site-fold.js')", "require('../z/site-fold.js')"),
          ])
          replace('w/display/z/navigation-physiology.js', [
              ("require('../../z/address.js')", "require('../../../z/address.js')"),
          ])
          replace('w/display/z/navigation-physiology.test.cjs', [
              ("require('../../z/address.js')", "require('../../../z/address.js')"),
          ])

          replace('y/test-address.cjs', [
              ("path.join(root,'w','display','navigation-physiology.test.cjs')", "path.join(root,'w','display','z','navigation-physiology.test.cjs')"),
              ("path.join(root,'w','display','site-holon.test.cjs')", "path.join(root,'w','display','x','site-holon.test.cjs')"),
              ("path.join(root,'w','display','navigation-physiology.js')", "path.join(root,'w','display','z','navigation-physiology.js')"),
          ])

          replace('y/check.py', [
              ("    for gene in 'wxzy': check((DISPLAY/gene/'ROLE.md').is_file(),f'missing materialized Display vertex {gene}')",
               "    allowed_root={'INDEX.yaml','RITUALS','_cambium.yaml','_feed','_root','_stomach','_waste','w','x','z','y'}\n    check({p.name for p in DISPLAY.iterdir()}==allowed_root,'Display root retains noncanonical or active tissue')\n    check(not (ROOT/'w'/'interface.md').exists(),'ad-hoc w/interface.md membrane file returned')\n    for gene in 'wxzy': check((DISPLAY/gene).is_dir() and not (DISPLAY/gene/'ROLE.md').exists(),f'Display vertex {gene} is missing or still marker-only')"),
              ("nav=(DISPLAY/'navigation-physiology.js').read_text(); world=(DISPLAY/'world-view.js').read_text(); runtime=(DISPLAY/'display-runtime-v2.js').read_text(); holon=(DISPLAY/'site-holon.js').read_text(); fold=(DISPLAY/'site-fold.js').read_text(); site_css=(DISPLAY/'site-runtime.css').read_text(); aperture=(DISPLAY/'navigation-aperture.js').read_text(); aperture_css=(DISPLAY/'navigation-aperture.css').read_text(); fields=(DISPLAY/'locus-shader.js').read_text()",
               "nav=(DISPLAY/'z'/'navigation-physiology.js').read_text(); world=(DISPLAY/'z'/'world-view.js').read_text(); runtime=(DISPLAY/'x'/'display-runtime-v2.js').read_text(); holon=(DISPLAY/'x'/'site-holon.js').read_text(); fold=(DISPLAY/'z'/'site-fold.js').read_text(); site_css=(DISPLAY/'z'/'site-runtime.css').read_text(); aperture=(DISPLAY/'z'/'navigation-aperture.js').read_text(); aperture_css=(DISPLAY/'z'/'navigation-aperture.css').read_text(); fields=(DISPLAY/'w'/'locus-shader.js').read_text()"),
              ("js_sources=['world-view.js','navigation-physiology.js','site-holon.js','site-fold.js','display-runtime-v2.js','locus-shader.js','navigation-aperture.js']+[s['renderer_path'].relative_to(DISPLAY).as_posix() for s in sites]",
               "js_sources=['z/world-view.js','z/navigation-physiology.js','x/site-holon.js','z/site-fold.js','x/display-runtime-v2.js','w/locus-shader.js','z/navigation-aperture.js']+[s['renderer_path'].relative_to(DISPLAY).as_posix() for s in sites]"),
              ("for test in ('navigation-physiology.test.cjs','site-holon.test.cjs','site-fold.test.cjs'):",
               "for test in ('z/navigation-physiology.test.cjs','x/site-holon.test.cjs','z/site-fold.test.cjs'):"),
          ])

          replace('.github/workflows/pages.yml', [
              ('node w/display/site-fold.test.cjs', 'node w/display/z/site-fold.test.cjs'),
          ])
          replace('.github/workflows/cloudflare-live.yml', [
              ("'w/display/live/**'", "'w/display/x/live/**'"),
              ('workingDirectory: w/display/live', 'workingDirectory: w/display/x/live'),
          ])

          live_readme=Path('w/display/x/live/README.md')
          if live_readme.exists():
              s=live_readme.read_text(encoding='utf-8').replace('w/display/live','w/display/x/live')
              live_readme.write_text(s,encoding='utf-8')

          replace('w/display/RITUALS/organism/RITUAL.md', [
              ('The `w/x/z/y` directories are material carrier vertices; cross-vertex closure tissue may remain at Display root when no single vertex owns it.',
               'The `w/x/z/y` directories carry all active functional tissue. After differentiation the Display root contains only canonical shell/receptors/constitution plus those four child addresses; there is no shared fifth functional layer.'),
          ])
          PY

          # exact root-shape invariant after the move
          python3 - <<'PY'
          from pathlib import Path
          d=Path('w/display')
          expected={'INDEX.yaml','RITUALS','_cambium.yaml','_feed','_root','_stomach','_waste','w','x','z','y'}
          actual={p.name for p in d.iterdir()}
          assert actual==expected,(sorted(actual),sorted(expected))
          assert not Path('w/interface.md').exists()
          for g in 'wxzy': assert not (d/g/'ROLE.md').exists()
          print('Display root evacuated:',sorted(actual))
          PY

          # prove path rewiring before persisting it
          python3 y/build.py --artifact /tmp/display-root-evacuation-site
          python3 y/check.py --artifact /tmp/display-root-evacuation-site
          SITE_DIR=/tmp/display-root-evacuation-site node y/test-address.cjs

          git config user.name 'QuantumCephalopod'
          git config user.email 'eds.mnemos@gmail.com'
          git add -A
          git commit -m 'display: complete whole-body root redistribution'
          git push origin HEAD:staging/display-metamorphosis
