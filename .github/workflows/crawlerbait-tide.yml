name: crawlerbait tide

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawlerbait-tide-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tide:
    if: github.repository == 'self-similar-systems/cambium'
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire canonical cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture only new Cloudflare pressure
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_TAG: ${{ secrets.CLOUDFLARE_ZONE_TAG }}
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/capture.py --write

      - name: Witness capture law
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/capture.py --self-test

      - name: Persist raw Traces before downstream metabolism
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'w/display/y/yw/crawlerbait/x/captures' 'w/display/y/yw/crawlerbait/x/cursor.json')" ]; then
            echo "no new provider window to persist"
          else
            git config user.name "crawlerbait tide"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'w/display/y/yw/crawlerbait/x/captures' \
                       'w/display/y/yw/crawlerbait/x/cursor.json'
            git commit -m "crawlerbait: capture Cloudflare trace window"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Metabolize owned local Traces
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/tide.py --write

      - name: Witness tide replay and public membrane
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/tide.py --self-test
          python3 w/display/y/yw/crawlerbait/y/replay.py --self-test
          python3 y/site-public.py --artifact _site
          python3 y/check.py --artifact _site
          SITE_DIR=_site node y/test-address.cjs
          node w/display/z/site-fold.test.cjs
          python3 y/site-public.py --artifact _site --check

      - name: Persist downstream Crawlerbait only when bytes changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'w/display/y/yw/crawlerbait/w' 'w/display/y/yw/crawlerbait/x/state.json' 'w/display/y/yw/crawlerbait/z/projection.json' 'w/display/y/yw/crawlerbait/z/public')" ]; then
            echo "no downstream Crawlerbait bytes changed"
            exit 0
          fi
          git config user.name "crawlerbait tide"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'w/display/y/yw/crawlerbait/w' \
                     'w/display/y/yw/crawlerbait/x/state.json' \
                     'w/display/y/yw/crawlerbait/z/projection.json' \
                     'w/display/y/yw/crawlerbait/z/public'
          if git diff --cached --quiet; then
            echo "no derived Crawlerbait body changed"
            exit 0
          fi
          git commit -m "crawlerbait: metabolize captured traces"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
