name: crawlerbait tide

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'One-time: ingest the full retained Cloudflare Security Analytics history before normal tides'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawlerbait-tide-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tide:
    if: github.repository == 'self-similar-systems/cambium'
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire canonical cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harvest passive Cloudflare pressure
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_TAG: ${{ secrets.CLOUDFLARE_ZONE_TAG }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_history }}" = "true" ]; then
            python3 w/display/y/yw/crawlerbait/y/backfill.py --write
            exit 0
          fi
          if python3 - <<'PY'
          import json, sys
          with open('w/display/y/yw/crawlerbait/x/state.json', encoding='utf-8') as f:
              state = json.load(f)
          sys.exit(0 if state.get('last_complete_end') is None else 1)
          PY
          then
            echo "initial retained-history backfill pending; ordinary tide skipped"
            exit 0
          fi
          python3 w/display/y/yw/crawlerbait/y/tide.py --write

      - name: Witness bounded tide and public membrane
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/tide.py --self-test
          python3 w/display/y/yw/crawlerbait/y/backfill.py --self-test
          python3 y/site-public.py --artifact _site
          python3 y/check.py --artifact _site
          SITE_DIR=_site node y/test-address.cjs
          node w/display/z/site-fold.test.cjs
          python3 y/site-public.py --artifact _site --check

      - name: Persist sediment only when bytes changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'w/display/y/yw/crawlerbait')" ]; then
            echo "no admitted crawler pressure; no commit"
            exit 0
          fi
          git config user.name "crawlerbait tide"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'w/display/y/yw/crawlerbait/x/state.json' \
                     'w/display/y/yw/crawlerbait/w/projection.json' \
                     'w/display/y/yw/crawlerbait/w/public'
          if git diff --cached --quiet; then
            echo "no canonical crawlerbait sediment changed"
            exit 0
          fi
          git commit -m "crawlerbait: sediment Cloudflare tide"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
