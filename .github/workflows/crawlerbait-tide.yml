name: crawlerbait tide

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawlerbait-tide-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tide:
    if: github.repository == 'self-similar-systems/cambium'
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire canonical cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harvest passive Cloudflare pressure
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_TAG: ${{ secrets.CLOUDFLARE_ZONE_TAG }}
        run: python3 w/display/y/yw/crawlerbait/tide.py --write

      - name: Witness bounded tide and public membrane
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/tide.py --self-test
          python3 y/site-public.py --artifact _site
          python3 y/check.py --artifact _site
          SITE_DIR=_site node y/test-address.cjs
          node w/display/z/site-fold.test.cjs
          python3 y/site-public.py --artifact _site --check

      - name: Persist sediment only when bytes changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'w/display/y/yw/crawlerbait')" ]; then
            echo "no admitted crawler pressure; no commit"
            exit 0
          fi
          git config user.name "crawlerbait tide"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'w/display/y/yw/crawlerbait/bait/state.json' \
                     'w/display/y/yw/crawlerbait/projection.json' \
                     'w/display/y/yw/crawlerbait/public'
          if git diff --cached --quiet; then
            echo "no canonical crawlerbait sediment changed"
            exit 0
          fi
          git commit -m "crawlerbait: sediment Cloudflare tide"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
