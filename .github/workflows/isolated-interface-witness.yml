name: Isolated interface field witness
on:
  push:
    branches: ['witness/membrane-20261108']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build current artifact
        run: python3 y/site-public.py --artifact _site
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Witness shared fields and visible controls
        run: python3 y/test-membrane-grid.py --artifact _site --out _membrane-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-field-witness
          path: _membrane-witness
          if-no-files-found: warn
