name: display membrane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Project local feeds from durable HOME
        if: github.event_name == 'push'
        env:
          HOME_BEFORE: ${{ github.event.before }}
          HOME_AFTER: ${{ github.sha }}
        run: |
          python3 y/feed.py --before "$HOME_BEFORE" --after "$HOME_AFTER"
          if ! git diff --quiet -- _feed w/display/_feed; then
            git config user.name "cambium feed"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _feed w/display/_feed
            git commit -m "feed: reflect durable HOME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build display membrane
        run: python3 y/build.py --artifact _site

      - name: Witness structural body
        run: python3 y/check.py --artifact _site

      - name: Witness address algebra
        run: SITE_DIR=_site node y/test-address.cjs

      - name: Verify membrane bytes
        run: python3 y/build.py --artifact _site --check

      - name: Configure GitHub Pages
        if: github.repository == 'self-similar-systems/cambium'
        uses: actions/configure-pages@v5

      - name: Upload display membrane
        if: github.repository == 'self-similar-systems/cambium'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository == 'self-similar-systems/cambium'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy display membrane
        id: deployment
        uses: actions/deploy-pages@v4
