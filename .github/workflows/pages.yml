name: display membrane

on:
  push:
    branches:
      - main
      - 'staging/**'
      - 'hotfix/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['papers static shadow materialization']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'self-similar-systems/cambium' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve materializer publication pressure
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 y/pages-actuation.py

      - name: Witness feed projector compatibility
        if: steps.publication.outputs.publish == 'true'
        run: python3 y/feed.py --before HEAD --after HEAD

      - name: Project derived repository surfaces
        if: steps.publication.outputs.publish == 'true' && github.event_name == 'push' && github.ref_name == 'main'
        env:
          HOME_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          projected=0
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            LIVE_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            echo "projection attempt ${attempt}: event=${EVENT_SHA} live=${LIVE_SHA}"
            if [ -n "${HOME_BEFORE}" ] && [ "${HOME_BEFORE//0/}" != "" ]; then
              if ! git merge-base --is-ancestor "${HOME_BEFORE}" "${LIVE_SHA}"; then
                echo "event predecessor ${HOME_BEFORE} is no longer an ancestor of live ${BRANCH}; skip stale feed actuation"
                git reset --hard "${LIVE_SHA}"; projected=1; break
              fi
            fi
            git reset --hard "${LIVE_SHA}"
            python3 y/feed.py --before "${HOME_BEFORE}" --after "${LIVE_SHA}"
            python3 y/readme.py
            if [ -z "$(git status --porcelain -- README.md '_feed/current.json' ':(glob)**/_feed/current.json')" ]; then
              echo "all derived repository surfaces already current"; projected=1; break
            fi
            git config user.name "cambium projection"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- README.md '_feed/current.json' ':(glob)**/_feed/current.json'
            git commit -m "projection: refresh derived surfaces"
            if git push origin "HEAD:${BRANCH}"; then projected=1; break; fi
            echo "remote ${BRANCH} advanced during projection; reacquiring and recomputing"; sleep "$((attempt * 2))"
          done
          if [ "${projected}" -ne 1 ]; then echo "::error::could not persist current derived projections after three bounded retries"; exit 1; fi

      - name: Witness repository projection
        if: steps.publication.outputs.publish == 'true' && github.ref_name == 'main'
        run: python3 y/readme.py --check

      - name: Witness repository projection
        if: steps.publication.outputs.publish == 'true' && github.ref_name == 'main'
        run: python3 y/readme.py --check

      - name: Build persistent Display membrane + site public surfaces
        if: steps.publication.outputs.publish == 'true'
        run: python3 y/site-public.py --artifact _site

      - name: Witness tree-addressed Display organism
        if: steps.publication.outputs.publish == 'true'
        run: python3 y/check.py --artifact _site

      - name: Witness address algebra
        if: steps.publication.outputs.publish == 'true'
        run: SITE_DIR=_site node y/test-address.cjs

      - name: Witness tetrahedral closure
        if: steps.publication.outputs.publish == 'true'
        run: node w/display/z/site-fold.test.cjs

      - name: Verify membrane bytes
        if: steps.publication.outputs.publish == 'true'
        run: python3 y/site-public.py --artifact _site --check

      - name: Upload staging browser witness
        if: steps.publication.outputs.publish == 'true' && github.repository == 'QuantumCephalopod/cambium'
        uses: actions/upload-artifact@v4
        with:
          name: staging-display
          path: _site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.publication.outputs.publish == 'true' && github.repository == 'self-similar-systems/cambium'
        uses: actions/configure-pages@v5

      - name: Upload display membrane
        if: steps.publication.outputs.publish == 'true' && github.repository == 'self-similar-systems/cambium'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository == 'self-similar-systems/cambium' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy display membrane
        id: deployment
        uses: actions/deploy-pages@v4
