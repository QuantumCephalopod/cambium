name: display membrane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Project local feeds from durable HOME
        if: github.event_name == 'push'
        env:
          HOME_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          projected=0
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            LIVE_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            echo "feed projection attempt ${attempt}: event=${EVENT_SHA} live=${LIVE_SHA}"

            if [ -n "${HOME_BEFORE}" ] && [ "${HOME_BEFORE//0/}" != "" ]; then
              if ! git merge-base --is-ancestor "${HOME_BEFORE}" "${LIVE_SHA}"; then
                echo "event predecessor ${HOME_BEFORE} is no longer an ancestor of live ${BRANCH}; skip stale feed actuation"
                git reset --hard "${LIVE_SHA}"
                projected=1
                break
              fi
            fi

            git reset --hard "${LIVE_SHA}"
            python3 y/feed.py --before "${HOME_BEFORE}" --after "${LIVE_SHA}"

            if [ -z "$(git status --porcelain -- '_feed/current.json' ':(glob)**/_feed/current.json')" ]; then
              echo "all organism-local feeds already current"
              projected=1
              break
            fi

            git config user.name "cambium feed"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '_feed/current.json' ':(glob)**/_feed/current.json'
            git commit -m "feed: reflect durable HOME"

            if git push origin "HEAD:${BRANCH}"; then
              projected=1
              break
            fi

            echo "remote ${BRANCH} advanced during feed projection; reacquiring and recomputing"
            sleep "$((attempt * 2))"
          done

          if [ "${projected}" -ne 1 ]; then
            echo "::error::could not persist current feed projection after three bounded retries"
            exit 1
          fi

      - name: Build display membrane
        run: python3 y/build.py --artifact _site

      - name: Witness structural body
        run: python3 y/check.py --artifact _site

      - name: Witness address algebra
        run: SITE_DIR=_site node y/test-address.cjs

      - name: Verify membrane bytes
        run: python3 y/build.py --artifact _site --check

      - name: Configure GitHub Pages
        if: github.repository == 'self-similar-systems/cambium'
        uses: actions/configure-pages@v5

      - name: Upload display membrane
        if: github.repository == 'self-similar-systems/cambium'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository == 'self-similar-systems/cambium'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy display membrane
        id: deployment
        uses: actions/deploy-pages@v4
