name: display live nerve

on:
  push:
    branches: [main, 'mnemos/**']
    paths:
      - 'w/display/x/live/**'
      - '.github/workflows/cloudflare-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Witness live nerve
        run: |
          node --check w/display/x/live/src/index.js
          node w/display/x/live/test.mjs

  deploy:
    needs: test
    if: github.repository == 'self-similar-systems/cambium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6

      - name: Deploy sss-live
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: w/display/x/live
          wranglerVersion: '4.131.1'
          command: deploy
