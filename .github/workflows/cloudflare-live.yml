name: display live nerve

on:
  push:
    branches: [main]
    paths:
      - 'w/display/x/live/**'
      - '.github/workflows/cloudflare-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'self-similar-systems/cambium'
    runs-on: ubuntu-latest

    steps:
      - name: Reacquire cambium
        uses: actions/checkout@v6

      - name: Deploy sss-live
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: w/display/x/live
          wranglerVersion: '4.131.1'
          command: deploy
