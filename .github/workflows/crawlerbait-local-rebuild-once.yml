name: crawlerbait local rebuild ONCE

on:
  push:
    branches:
      - hotfix/crawlerbait-post-merge-continuity
    paths:
      - '.github/workflows/crawlerbait-local-rebuild-once.yml'

permissions:
  contents: write

concurrency:
  group: crawlerbait-local-rebuild-once
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'QuantumCephalopod/cambium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild Crawlerbait from already-owned public Traces
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/tide.py --write
          python3 w/display/y/yw/crawlerbait/y/tide.py --self-test
          python3 w/display/y/yw/crawlerbait/y/replay.py --self-test
          python3 y/site-public.py --artifact _site
          python3 y/check.py --artifact _site

      - name: Persist regenerated local body
        run: |
          set -euo pipefail
          git config user.name "crawlerbait repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'w/display/y/yw/crawlerbait/w'                      'w/display/y/yw/crawlerbait/x/state.json'                      'w/display/y/yw/crawlerbait/z/projection.json'                      'w/display/y/yw/crawlerbait/z/public'
          if git diff --cached --quiet; then
            echo "derived Crawlerbait body already current"
            exit 0
          fi
          git commit -m "crawlerbait: materialize captured public traffic"
          git push origin HEAD:hotfix/crawlerbait-post-merge-continuity
