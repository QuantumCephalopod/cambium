name: temporary staging feed projection

on:
  push:
    branches: [staging/display-metamorphosis]
    paths:
      - '.github/workflows/feed-staging-metamorphosis.yml'

permissions:
  contents: write

concurrency:
  group: temporary-staging-feed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'QuantumCephalopod/cambium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reproject Display feed with stable source revision
        run: |
          set -euo pipefail
          rm -f w/display/_feed/current.json
          python3 y/feed.py --before 88e6ebc7c36c8e11c22351f1b87d0f62e0d93308 --after "${GITHUB_SHA}"
          git config user.name "cambium feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add w/display/_feed/current.json
          git commit -m "feed: pin Display HOME source revision"
          git push origin HEAD:staging/display-metamorphosis
