name: crawlerbait retained-history bootstrap ONCE

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawlerbait-tide-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'self-similar-systems/cambium'
    runs-on: ubuntu-latest
    steps:
      - name: Reacquire canonical cambium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Witness one-time freezer
        run: |
          set -euo pipefail
          python3 w/display/y/yw/crawlerbait/y/bootstrap_once.py --self-test

      - name: Freeze every Cloudflare window still retained NOW
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_TAG: ${{ secrets.CLOUDFLARE_ZONE_TAG }}
        run: |
          set -euo pipefail
          test ! -f w/display/y/yw/crawlerbait/x/retained-bootstrap/seal.json
          python3 w/display/y/yw/crawlerbait/y/bootstrap_once.py --write

      - name: Witness frozen raw archive
        run: |
          set -euo pipefail
          python3 y/site-public.py --artifact _site
          python3 y/check.py --artifact _site

      - name: Persist the one-time retained history
        run: |
          set -euo pipefail
          git config user.name "crawlerbait bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'w/display/y/yw/crawlerbait/x/retained-bootstrap'
          if git diff --cached --quiet; then
            echo "bootstrap produced no new retained-history bytes"
            exit 1
          fi
          git commit -m "crawlerbait: freeze retained Cloudflare history once"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
