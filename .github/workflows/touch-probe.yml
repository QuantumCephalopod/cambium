name: touch probe
on:
  push:
    branches: ['staging/mobile-display-unified-format-test-20261110']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: python3 y/site-public.py --artifact _site
      - run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - run: python3 y/diagnose-format-touch.py
